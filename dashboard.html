<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - Smart Attendance Tracker</title>
  <link rel="stylesheet" href="style.css">

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="dashboard">
    <h2>Student Attendance Dashboard</h2>

    <div class="card">
      <h3 id="studentName"></h3>
      <p><b>Register Number:</b> <span id="studentReg"></span></p>

      <p><b>Total Classes Conducted:</b> <span id="totalClasses"></span></p>
      <p><b>Total Classes Attended:</b> <span id="attendedClasses"></span></p>

      <p><b>Attendance Percentage:</b> <span id="percentage"></span></p>
      <p><b>Status:</b> <span id="status"></span></p>
    </div>

    <div class="card">
      <h3>Monthly Attendance Bar Graph</h3>
      <canvas id="attendanceChart"></canvas>
    </div>

    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <script src="script.js"></script>

</body>
</html>
